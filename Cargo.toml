# Module: keyway.workspace
# Purpose: Declare the workspace members and their pinned dependencies.
# Created: 2026-11-08
# Architecture: Each binary joins this list when it is written; see ARCHITECTURE.md.

[workspace]
resolver = "3"
members = [
    "crates/keyway",
    "crates/keyway-core",
    "crates/keyway-desktop",
    "crates/keyway-router",
    "crates/keyway-settings",
]

[workspace.package]
version = "0.1.11"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
gtk = "=0.18.2"
libc = "=0.2.190"
nix = { version = "=0.31.3", features = ["inotify", "ioctl", "poll", "signal", "socket"] }
roxmltree = "=0.21.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.1.8"
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
