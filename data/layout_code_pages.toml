# Module: keyway.data.layout_code_pages
# Purpose: Map XKB layouts to the OEM and ANSI code pages of their Windows locale.
# Created: 2026-11-08
# Architecture: Embedded by keyway-core code_pages; users override it in their config.
# Lookup tries layout+variant, then layout, then default. Layouts whose Windows locale is
# Unicode-only or double-byte use the default.

default = { oem = 437, ansi = 1252 }

[layouts]
# Western European and other Latin script locales.
